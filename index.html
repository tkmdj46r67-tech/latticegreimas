<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Lattice — Solar System</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1f35;
    --panel-2: #232a45;
    --text: #e6e8f0;
    --text-dim: #8a90a8;
    --node: #5b9bd5;
    --node-edge: #d0d8e8;
    --hover: #ffd23f;
    --anc: #ff8c42;
    --desc: #e63946;
    --edge: #4a5170;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    padding: 22px 34px 16px;
    border-bottom: 1px solid #2a2f45;
  }
  header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--text-dim); font-size: 13px; }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 12px 34px;
    font-size: 12px; color: var(--text-dim);
  }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px;
    vertical-align: middle;
    position: relative; top: -1px;
  }

  .container {
    display: flex; gap: 22px;
    padding: 10px 34px 40px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  #lattice-wrap { flex: 1 1 600px; min-width: 380px; }
  #panel { flex: 0 1 420px; min-width: 320px; }

  #lattice {
    background: var(--panel);
    border-radius: 14px;
    width: 100%; height: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    display: block;
  }

  /* --- SVG nodes --- */
  .node { cursor: pointer; }
  .node circle {
    fill: var(--node);
    stroke: var(--node-edge);
    stroke-width: 1.5;
    transition: fill .25s, stroke .25s, r .25s;
    r: 26;
  }
  .node text {
    fill: #c8cde0;
    font-size: 11px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
  }
  .edge {
    stroke: var(--edge);
    stroke-width: 1.5;
    transition: stroke .25s, stroke-width .25s, stroke-opacity .25s;
  }

  .node.hovered circle {
    fill: var(--hover);
    stroke: #fff3c4;
    stroke-width: 3;
    filter: drop-shadow(0 0 14px rgba(255,210,63,.85));
    r: 30;
  }
  .node.ancestor circle {
    fill: var(--anc);
    stroke: #ffcfae;
    stroke-width: 2;
    animation: pulseNodeOrange 1.9s ease-in-out infinite;
  }
  .node.descendant circle {
    fill: var(--desc);
    stroke: #ffb0b8;
    stroke-width: 2;
    animation: pulseNodeRed 1.9s ease-in-out infinite;
  }
  .edge.ancestor {
    stroke: var(--anc);
    stroke-width: 3;
    animation: pulseEdgeOrange 1.9s ease-in-out infinite;
  }
  .edge.descendant {
    stroke: var(--desc);
    stroke-width: 3;
    animation: pulseEdgeRed 1.9s ease-in-out infinite;
  }

  @keyframes pulseNodeOrange {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255,140,66,.4)); }
    50%      { filter: drop-shadow(0 0 16px rgba(255,140,66,1)); }
  }
  @keyframes pulseNodeRed {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(230,57,70,.4)); }
    50%      { filter: drop-shadow(0 0 16px rgba(230,57,70,1)); }
  }
  @keyframes pulseEdgeOrange {
    0%, 100% { stroke-opacity: .55; }
    50%      { stroke-opacity: 1; }
  }
  @keyframes pulseEdgeRed {
    0%, 100% { stroke-opacity: .55; }
    50%      { stroke-opacity: 1; }
  }

  /* --- Panel cards --- */
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 18px 20px 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    max-height: 70vh;
    overflow-y: auto;
  }
  .card h2 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .node-title {
    font-size: 17px; font-weight: 700;
    color: var(--hover);
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
    margin: 16px 0 6px;
    border-top: 1px solid #2a2f45;
    padding-top: 12px;
  }
  .section-title.first { border-top: none; padding-top: 0; margin-top: 0; }
  .kv { margin-bottom: 8px; font-size: 13px; line-height: 1.55; }
  .kv .k { color: var(--text-dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11.5px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3f55;
    white-space: nowrap;
  }
  .chip.obj { background: #23324d; border-color: #4a6a9a; color: #cce0ff; }
  .chip.attr { background: #33254d; border-color: #6a4a9a; color: #e0ccff; }
  .chip.anc { background: #4a2a1a; border-color: #8c4a2a; color: #ffd1b3; }
  .chip.desc { background: #4a1a2a; border-color: #8c2a3a; color: #ffb8c4; }
  .chip.self { background: #4a3a1a; border-color: #8c6a2a; color: #fff0b3; font-weight: 600; }

  .hint { color: var(--text-dim); font-size: 13px; font-style: italic; }

  #scatter { background: var(--panel); border-radius: 14px; width: 100%; display: block; box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
  .scatter-hint { color: var(--text-dim); font-size: 11.5px; margin-top: 8px; text-align: center; }

  .arrow-anc { color: var(--anc); font-weight: 700; }
  .arrow-desc { color: var(--desc); font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>Concept Lattice — Solar System</h1>
  <p>Hover a node to explore its joins, meets, ancestors, and descendants.</p>
</header>

<div class="legend">
  <span><span class="dot" style="background:#5b9bd5"></span>Concept</span>
  <span><span class="dot" style="background:#ffd23f"></span>Hovered</span>
  <span><span class="dot" style="background:#ff8c42"></span>Above (join direction)</span>
  <span><span class="dot" style="background:#e63946"></span>Below (meet direction)</span>
</div>

<div class="container">
  <div id="lattice-wrap">
    <svg id="lattice" viewBox="0 0 800 660"></svg>
  </div>
  <div id="panel">
    <div class="card" id="info-card">
      <h2>Node</h2>
      <div class="hint">Hover a node in the lattice to see details.</div>
    </div>
    <div class="card">
      <h2>Extent × Intent</h2>
      <svg id="scatter" viewBox="0 0 400 280"></svg>
      <div class="scatter-hint">x = |extent| · y = |intent|</div>
    </div>
  </div>
</div>

<script>
// =========================================================
// 1. DATA
// =========================================================

const CONCEPTS = [
  { id: 0, label: '⊥',
    short: 'Bottom',
    name: 'Bottom — empty extent, all attributes',
    extent: [],
    intent: ['Is a planet','Is small','Is large','Has no moons','Has moons','Is far from sun'],
    x: 0.50, y: 0.04 },

  { id: 1, label: 'Small · no moons',
    short: 'Sm·NM',
    name: 'Small planets without moons',
    extent: ['Mercury','Venus'],
    intent: ['Is a planet','Is small','Has no moons'],
    x: 0.14, y: 0.30 },

  { id: 2, label: 'Small · has moons',
    short: 'Sm·HM',
    name: 'Small planets with moons',
    extent: ['Earth','Mars'],
    intent: ['Is a planet','Is small','Has moons'],
    x: 0.50, y: 0.30 },

  { id: 3, label: 'Large · moons · far',
    short: 'Lg·HM·FS',
    name: 'Large planets with moons, far from sun',
    extent: ['Jupiter','Saturn'],
    intent: ['Is a planet','Is large','Has moons','Is far from sun'],
    x: 0.86, y: 0.30 },

  { id: 4, label: 'Small',
    short: 'Small',
    name: 'All small planets',
    extent: ['Mercury','Venus','Earth','Mars'],
    intent: ['Is a planet','Is small'],
    x: 0.28, y: 0.56 },

  { id: 5, label: 'Has moons',
    short: 'Moons',
    name: 'All planets with moons',
    extent: ['Earth','Mars','Jupiter','Saturn'],
    intent: ['Is a planet','Has moons'],
    x: 0.72, y: 0.56 },

  { id: 6, label: '⊤',
    short: 'Top',
    name: 'Top — all planets, shared attribute only',
    extent: ['Mercury','Venus','Earth','Mars','Jupiter','Saturn'],
    intent: ['Is a planet'],
    x: 0.50, y: 0.82 }
];

const EDGES = [
  [0,1],[0,2],[0,3],
  [1,4],
  [2,4],[2,5],
  [3,5],
  [4,6],[5,6]
];

// =========================================================
// 2. STRUCTURE
// =========================================================

const N = CONCEPTS.length;

const parents = Array.from({length:N}, () => []);
const children = Array.from({length:N}, () => []);
EDGES.forEach(([a,b]) => {
  parents[a].push(b);
  children[b].push(a);
});

function ancestorsOf(i) {
  const seen = new Set();
  const stack = [...parents[i]];
  while (stack.length) {
    const j = stack.pop();
    if (seen.has(j)) continue;
    seen.add(j);
    stack.push(...parents[j]);
  }
  return seen;
}
function descendantsOf(i) {
  const seen = new Set();
  const stack = [...children[i]];
  while (stack.length) {
    const j = stack.pop();
    if (seen.has(j)) continue;
    seen.add(j);
    stack.push(...children[j]);
  }
  return seen;
}

const ANCS = CONCEPTS.map((_, i) => ancestorsOf(i));
const DESC = CONCEPTS.map((_, i) => descendantsOf(i));

function join(a, b) {
  if (a === b) return a;
  if (ANCS[a].has(b)) return b;          // b above a
  if (ANCS[b].has(a)) return a;          // a above b
  const upA = new Set([a, ...ANCS[a]]);
  const upB = new Set([b, ...ANCS[b]]);
  const inter = [...upA].filter(x => upB.has(x));
  // minimal element: no strict descendant in inter
  for (const x of inter) {
    let minimal = true;
    for (const y of inter) {
      if (y !== x && DESC[x].has(y)) { minimal = false; break; }
    }
    if (minimal) return x;
  }
  return inter[0];
}
function meet(a, b) {
  if (a === b) return a;
  if (DESC[a].has(b)) return b;          // b below a
  if (DESC[b].has(a)) return a;          // a below b
  const downA = new Set([a, ...DESC[a]]);
  const downB = new Set([b, ...DESC[b]]);
  const inter = [...downA].filter(x => downB.has(x));
  // maximal element: no strict ancestor in inter
  for (const x of inter) {
    let maximal = true;
    for (const y of inter) {
      if (y !== x && ANCS[x].has(y)) { maximal = false; break; }
    }
    if (maximal) return x;
  }
  return inter[0];
}

// =========================================================
// 3. LATTICE RENDERING
// =========================================================

const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('lattice');
const W = 800, H = 660;
const PAD_X = 100, PAD_Y = 90;
const NODE_R = 26;

const px = CONCEPTS.map(c => ({
  x: PAD_X + c.x * (W - 2*PAD_X),
  y: H - PAD_Y - c.y * (H - 2*PAD_Y)
}));

// Edges
const edgeEls = [];
EDGES.forEach(([a,b]) => {
  const line = document.createElementNS(svgNS, 'line');
  line.setAttribute('x1', px[a].x);
  line.setAttribute('y1', px[a].y);
  line.setAttribute('x2', px[b].x);
  line.setAttribute('y2', px[b].y);
  line.setAttribute('class', 'edge');
  line.dataset.a = a;
  line.dataset.b = b;
  svg.appendChild(line);
  edgeEls.push(line);
});

// Nodes
const nodeEls = [];
CONCEPTS.forEach((c, i) => {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'node');
  g.dataset.id = i;

  const circle = document.createElementNS(svgNS, 'circle');
  circle.setAttribute('cx', px[i].x);
  circle.setAttribute('cy', px[i].y);
  circle.setAttribute('r', NODE_R);
  g.appendChild(circle);

  // Two-line label below node
  const lines = c.label.split(' · ');
  lines.forEach((ln, k) => {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', px[i].x);
    t.setAttribute('y', px[i].y + NODE_R + 18 + k * 13);
    t.setAttribute('text-anchor', 'middle');
    t.textContent = ln;
    g.appendChild(t);
  });

  svg.appendChild(g);
  nodeEls.push(g);

  g.addEventListener('mouseenter', () => setHover(i));
  g.addEventListener('mouseleave', () => clearHover());
});

// =========================================================
// 4. HOVER STATE
// =========================================================

let currentHover = null;

function setHover(i) {
  currentHover = i;

  nodeEls.forEach((el, k) => {
    el.classList.remove('hovered','ancestor','descendant');
    if (k === i) el.classList.add('hovered');
    else if (ANCS[i].has(k)) el.classList.add('ancestor');
    else if (DESC[i].has(k)) el.classList.add('descendant');
  });

  edgeEls.forEach(line => {
    line.classList.remove('ancestor','descendant');
    const a = parseInt(line.dataset.a);
    const b = parseInt(line.dataset.b);
    // Edge above i: bottom endpoint a is >= i
    const isAbove = (a === i) || ANCS[i].has(a);
    // Edge below i: top endpoint b is <= i
    const isBelow = (b === i) || DESC[i].has(b);
    if (isAbove) line.classList.add('ancestor');
    else if (isBelow) line.classList.add('descendant');
  });

  updatePanel(i);
  updateScatter(i);
}

function clearHover() {
  currentHover = null;
  nodeEls.forEach(el => el.classList.remove('hovered','ancestor','descendant'));
  edgeEls.forEach(line => line.classList.remove('ancestor','descendant'));
  document.getElementById('info-card').innerHTML =
    '<h2>Node</h2><div class="hint">Hover a node in the lattice to see details.</div>';
  updateScatter(null);
}

// =========================================================
// 5. PANEL
// =========================================================

function chipList(arr, cls) {
  return arr.map(x => `<span class="chip ${cls}">${x}</span>`).join('');
}
function chipNodes(ids, cls) {
  return ids.map(j => `<span class="chip ${cls}">${CONCEPTS[j].label}</span>`).join(' ');
}

function updatePanel(i) {
  const c = CONCEPTS[i];

  // Joins grouped by result
  const joinsByResult = {};
  for (let j = 0; j < N; j++) {
    if (j === i) continue;
    const r = join(i, j);
    (joinsByResult[r] ||= []).push(j);
  }
  // Meets grouped by result
  const meetsByResult = {};
  for (let j = 0; j < N; j++) {
    if (j === i) continue;
    const r = meet(i, j);
    (meetsByResult[r] ||= []).push(j);
  }
  // Pairs for which i is the join
  const asJoinOf = [];
  for (let x = 0; x < N; x++) {
    if (x === i) continue;
    for (let y = x + 1; y < N; y++) {
      if (y === i) continue;
      if (join(x, y) === i) asJoinOf.push([x, y]);
    }
  }
  // Pairs for which i is the meet
  const asMeetOf = [];
  for (let x = 0; x < N; x++) {
    if (x === i) continue;
    for (let y = x + 1; y < N; y++) {
      if (y === i) continue;
      if (meet(x, y) === i) asMeetOf.push([x, y]);
    }
  }

  let html = `<h2>Node</h2><div class="node-title">${c.name}</div>`;

  html += `<div class="section-title first">Extent (objects)</div>`;
  html += c.extent.length
    ? `<div class="chips">${chipList(c.extent, 'obj')}</div>`
    : `<div class="hint" style="font-size:12px;">∅ — no objects</div>`;

  html += `<div class="section-title">Intent (attributes)</div>`;
  html += c.intent.length
    ? `<div class="chips">${chipList(c.intent, 'attr')}</div>`
    : `<div class="hint" style="font-size:12px;">∅ — no shared attributes</div>`;

  html += `<div class="section-title">Hierarchy</div>`;
  html += `<div class="kv"><span class="k">Covered by:</span> ${
    parents[i].length ? chipNodes(parents[i], 'anc')
                      : `<span class="hint" style="font-size:12px;">nothing (top)</span>`
  }</div>`;
  html += `<div class="kv"><span class="k">Covers:</span> ${
    children[i].length ? chipNodes(children[i], 'desc')
                       : `<span class="hint" style="font-size:12px;">nothing (bottom)</span>`
  }</div>`;

  html += `<div class="section-title">Joins with other nodes</div>`;
  html += `<div class="kv" style="color:var(--text-dim);font-size:12px;">This node ⊔ each other node:</div>`;
  Object.keys(joinsByResult).sort((a,b)=>+a - +b).forEach(r => {
    html += `<div class="kv"><span class="arrow-anc">⊔ → ${CONCEPTS[r].label}</span><br>`;
    html += `with ${chipNodes(joinsByResult[r], '')}</div>`;
  });

  html += `<div class="section-title">Meets with other nodes</div>`;
  html += `<div class="kv" style="color:var(--text-dim);font-size:12px;">This node ⊓ each other node:</div>`;
  Object.keys(meetsByResult).sort((a,b)=>+a - +b).forEach(r => {
    html += `<div class="kv"><span class="arrow-desc">⊓ → ${CONCEPTS[r].label}</span><br>`;
    html += `with ${chipNodes(meetsByResult[r], '')}</div>`;
  });

  if (asJoinOf.length) {
    html += `<div class="section-title">This node as a join</div>`;
    html += `<div class="kv" style="color:var(--text-dim);font-size:12px;">Pairs of other nodes whose join is this node:</div>`;
    asJoinOf.forEach(([x, y]) => {
      html += `<div class="kv"><span class="chip self">${CONCEPTS[x].label} ⊔ ${CONCEPTS[y].label}</span> = <span class="chip self">${c.label}</span></div>`;
    });
  }

  if (asMeetOf.length) {
    html += `<div class="section-title">This node as a meet</div>`;
    html += `<div class="kv" style="color:var(--text-dim);font-size:12px;">Pairs of other nodes whose meet is this node:</div>`;
    asMeetOf.forEach(([x, y]) => {
      html += `<div class="kv"><span class="chip self">${CONCEPTS[x].label} ⊓ ${CONCEPTS[y].label}</span> = <span class="chip self">${c.label}</span></div>`;
    });
  }

  document.getElementById('info-card').innerHTML = html;
}

// =========================================================
// 6. SCATTER PLOT
// =========================================================

const scatter = document.getElementById('scatter');
const SC_W = 400, SC_H = 280;
const SC_PAD_L = 46, SC_PAD_R = 20, SC_PAD_T = 20, SC_PAD_B = 40;
const SC_INNER_W = SC_W - SC_PAD_L - SC_PAD_R;
const SC_INNER_H = SC_H - SC_PAD_T - SC_PAD_B;
const MAX_EXT = 6, MAX_INT = 6;

const scX = v => SC_PAD_L + (v / MAX_EXT) * SC_INNER_W;
const scY = v => SC_H - SC_PAD_B - (v / MAX_INT) * SC_INNER_H;

const scDotEls = [];

function buildScatter() {
  scatter.innerHTML = '';

  // Grid lines
  for (let k = 0; k <= MAX_EXT; k++) {
    const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', scX(k));
    l.setAttribute('y1', scY(0));
    l.setAttribute('x2', scX(k));
    l.setAttribute('y2', scY(MAX_INT));
    l.setAttribute('stroke', '#222a45');
    l.setAttribute('stroke-width', 1);
    scatter.appendChild(l);
  }
  for (let k = 0; k <= MAX_INT; k++) {
    const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', scX(0));
    l.setAttribute('y1', scY(k));
    l.setAttribute('x2', scX(MAX_EXT));
    l.setAttribute('y2', scY(k));
    l.setAttribute('stroke', '#222a45');
    l.setAttribute('stroke-width', 1);
    scatter.appendChild(l);
  }

  // Axes
  const ax = document.createElementNS(svgNS, 'line');
  ax.setAttribute('x1', scX(0)); ax.setAttribute('y1', scY(0));
  ax.setAttribute('x2', scX(MAX_EXT)); ax.setAttribute('y2', scY(0));
  ax.setAttribute('stroke', '#3a3f55'); ax.setAttribute('stroke-width', 1.5);
  scatter.appendChild(ax);

  const ay = document.createElementNS(svgNS, 'line');
  ay.setAttribute('x1', scX(0)); ay.setAttribute('y1', scY(0));
  ay.setAttribute('x2', scX(0)); ay.setAttribute('y2', scY(MAX_INT));
  ay.setAttribute('stroke', '#3a3f55'); ay.setAttribute('stroke-width', 1.5);
  scatter.appendChild(ay);

  // Ticks
  for (let k = 0; k <= MAX_EXT; k++) {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', scX(k));
    t.setAttribute('y', SC_H - SC_PAD_B + 18);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', '#5a6080');
    t.style.fontSize = '10px';
    t.textContent = k;
    scatter.appendChild(t);
  }
  for (let k = 0; k <= MAX_INT; k++) {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', SC_PAD_L - 8);
    t.setAttribute('y', scY(k) + 4);
    t.setAttribute('text-anchor', 'end');
    t.setAttribute('fill', '#5a6080');
    t.style.fontSize = '10px';
    t.textContent = k;
    scatter.appendChild(t);
  }

  // Axis labels
  const xl = document.createElementNS(svgNS, 'text');
  xl.setAttribute('x', SC_W / 2);
  xl.setAttribute('y', SC_H - 8);
  xl.setAttribute('text-anchor', 'middle');
  xl.setAttribute('fill', '#8a90a8');
  xl.style.fontSize = '11px';
  xl.style.fontWeight = '600';
  xl.textContent = '|extent| (number of objects)';
  scatter.appendChild(xl);

  const yl = document.createElementNS(svgNS, 'text');
  yl.setAttribute('x', 14);
  yl.setAttribute('y', SC_H / 2);
  yl.setAttribute('text-anchor', 'middle');
  yl.setAttribute('fill', '#8a90a8');
  yl.style.fontSize = '11px';
  yl.style.fontWeight = '600';
  yl.setAttribute('transform', `rotate(-90, 14, ${SC_H/2})`);
  yl.textContent = '|intent| (number of attributes)';
  scatter.appendChild(yl);

  // Dots
  CONCEPTS.forEach((c, i) => {
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', scX(c.extent.length));
    dot.setAttribute('cy', scY(c.intent.length));
    dot.setAttribute('r', 8);
    dot.setAttribute('fill', '#5b9bd5');
    dot.setAttribute('stroke', '#0f1220');
    dot.setAttribute('stroke-width', '2');
    dot.dataset.id = i;
    dot.style.transition = 'r .25s, fill .25s, filter .25s';
    dot.style.cursor = 'pointer';
    scatter.appendChild(dot);
    scDotEls.push(dot);

    // Short label above the dot
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', scX(c.extent.length));
    t.setAttribute('y', scY(c.intent.length) - 14);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', '#8a90a8');
    t.style.fontSize = '10px';
    t.style.fontWeight = '600';
    t.style.pointerEvents = 'none';
    t.textContent = c.short;
    scatter.appendChild(t);

    // Hover on the dot too
    dot.addEventListener('mouseenter', () => setHover(i));
    dot.addEventListener('mouseleave', () => clearHover());
  });
}

buildScatter();

function updateScatter(i) {
  scDotEls.forEach(dot => {
    const id = parseInt(dot.dataset.id);
    if (i === null) {
      dot.setAttribute('r', 8);
      dot.setAttribute('fill', '#5b9bd5');
      dot.style.filter = 'none';
    } else if (id === i) {
      dot.setAttribute('r', 13);
      dot.setAttribute('fill', '#ffd23f');
      dot.style.filter = 'drop-shadow(0 0 10px rgba(255,210,63,1))';
    } else if (ANCS[i].has(id)) {
      dot.setAttribute('r', 9);
      dot.setAttribute('fill', '#ff8c42');
      dot.style.filter = 'drop-shadow(0 0 6px rgba(255,140,66,.7))';
    } else if (DESC[i].has(id)) {
      dot.setAttribute('r', 9);
      dot.setAttribute('fill', '#e63946');
      dot.style.filter = 'drop-shadow(0 0 6px rgba(230,57,70,.7))';
    } else {
      dot.setAttribute('r', 6);
      dot.setAttribute('fill', '#3a3f55');
      dot.style.filter = 'none';
    }
  });
}
</script>
