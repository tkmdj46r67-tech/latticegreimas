<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Lattice Viewer</title>
<style>
  :root {
    --bg: #0f1220; --panel: #1a1f35; --panel-2: #232a45;
    --text: #e6e8f0; --text-dim: #8a90a8;
    --node: #5b9bd5; --node-edge: #d0d8e8;
    --hover: #ffd23f; --anc: #ff8c42; --desc: #e63946;
    --edge: #4a5170; --accent: #5b9bd5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 100vh;
  }
  header { padding: 22px 34px 14px; border-bottom: 1px solid #2a2f45; }
  header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--text-dim); font-size: 13px; }

  .json-card {
    margin: 12px 34px 0;
    background: var(--panel); border-radius: 12px;
    border: 1px solid #2a2f45;
    overflow: hidden;
  }
  .json-card > summary {
    padding: 10px 16px; cursor: pointer;
    font-size: 12px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-dim);
    user-select: none;
  }
  .json-card > summary:hover { color: var(--text); }
  .json-card[open] > summary { border-bottom: 1px solid #2a2f45; color: var(--text); }
  .json-body { padding: 14px 16px; }
  .json-body textarea {
    width: 100%; min-height: 120px; resize: vertical;
    background: #0a0d1a; color: var(--text);
    border: 1px solid #2f3550; border-radius: 8px;
    padding: 10px 12px; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11.5px; line-height: 1.4;
  }
  .json-actions {
    display: flex; gap: 10px; align-items: center; margin-top: 10px;
  }
  .json-btn {
    appearance: none; border: 1px solid var(--accent);
    background: #22304d; color: #fff;
    padding: 8px 18px; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .18s, box-shadow .18s;
  }
  .json-btn:hover { background: #2c3f63; box-shadow: 0 0 10px rgba(91,155,213,.4); }
  .json-status { font-size: 12px; }
  .json-status.ok { color: #6fdc8c; }
  .json-status.err { color: #ff6b6b; }

  .tabbar { display: flex; gap: 8px; padding: 14px 34px 0; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 1px solid #2f3550; background: var(--panel);
    color: var(--text-dim); padding: 8px 16px; border-radius: 10px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .18s, color .18s, border-color .18s, box-shadow .18s;
  }
  .tab:hover { color: var(--text); border-color: #3d456b; }
  .tab.active {
    background: #22304d; color: #fff; border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 14px rgba(91,155,213,.35);
  }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 14px 34px 0; font-size: 12px; color: var(--text-dim);
  }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px; vertical-align: middle;
    position: relative; top: -1px;
  }

  .container {
    display: flex; gap: 22px; padding: 14px 34px 40px;
    align-items: flex-start; flex-wrap: wrap;
  }
  #lattice-wrap { flex: 1 1 640px; min-width: 380px; }
  #panel { flex: 0 1 520px; min-width: 400px; }

  #lattice {
    background: var(--panel); border-radius: 14px; width: 100%; height: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35); display: block;
  }
  #greimas { background: transparent; width: 100%; height: auto; display: block; }

  .node { cursor: pointer; }
  .node circle {
    fill: var(--node); stroke: var(--node-edge); stroke-width: 1.5;
    transition: fill .25s, stroke .25s, r .25s;
  }
  .node text {
    fill: #c8cde0; font-size: 10.5px; font-weight: 600;
    text-anchor: middle; pointer-events: none; user-select: none;
  }
